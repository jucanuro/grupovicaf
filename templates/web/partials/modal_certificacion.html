{% comment %}
  Modal único de certificaciones (specs/WEB v4, REQ-WEB-45 a 48). Reemplaza
  al modal de la imagen INACAL y al visor del PDF ISO 9001 de v3.

  certificaciones.js le pone el título, crea dentro de [data-cert-contenido]
  un <img> (imagen) o un <iframe> (PDF) y apunta "Descargar" al archivo. Hasta
  abrirlo no hay nada que descargar: el archivo no se carga con la página
  (regla 17). Al cerrarlo se quita el elemento y se libera el archivo.
{% endcomment %}
<div id="modal-certificacion"
     class="fixed inset-0 z-[60] hidden items-center justify-center bg-slate-950/80 p-4 backdrop-blur-sm"
     role="dialog" aria-modal="true" aria-labelledby="modal-certificacion-titulo">
    <div data-cert-panel class="relative flex max-h-[90vh] w-full max-w-5xl flex-col overflow-hidden rounded-2xl bg-white shadow-2xl">
        <div class="flex items-center justify-between gap-4 border-b border-slate-200 px-5 py-4">
            <h2 id="modal-certificacion-titulo" class="text-lg font-black tracking-tight text-slate-900">Certificado</h2>
            <button type="button" data-cert-cerrar aria-label="Cerrar certificado"
                    class="rounded-full p-1.5 text-slate-500 transition-colors hover:bg-slate-100 hover:text-slate-900 focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-700">
                <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12"/>
                </svg>
            </button>
        </div>
        <div data-cert-contenido class="flex min-h-0 flex-1 overflow-auto bg-slate-100"></div>
        <div class="flex items-center justify-end gap-3 border-t border-slate-200 px-5 py-4">
            <a data-cert-descargar href="#" download class="btn-secondary !h-10 !px-4 !text-xs">
                <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75V16.5M16.5 12 12 16.5m0 0L7.5 12m4.5 4.5V3"/>
                </svg>
                Descargar
            </a>
            <button type="button" data-cert-cerrar class="btn-primary !h-10 !px-4 !text-xs">Cerrar</button>
        </div>
    </div>
</div>
