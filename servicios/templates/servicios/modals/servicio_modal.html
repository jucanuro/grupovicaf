<div id="modalServicio" class="fixed inset-0 z-[9999] hidden overflow-y-auto">
    <div class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm" onclick="closeServicioModal()"></div>

    <div class="flex min-h-full items-center justify-center p-4">
        <div class="relative bg-white rounded-2xl shadow-2xl w-full max-w-lg border border-slate-200 z-10 animate-in fade-in zoom-in duration-200">

            <div class="bg-slate-50 border-b border-slate-100 p-4 flex justify-between items-center rounded-t-2xl">
                <div class="flex items-center gap-3">
                    <div class="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center text-white">
                        <i data-lucide="flask-conical" class="w-4 h-4"></i>
                    </div>
                    <div>
                        <h3 class="text-[11px] font-black text-slate-800 uppercase tracking-widest">Nuevo Servicio (Ensayo)</h3>
                        <p class="text-[8px] font-mono-tech text-blue-500 uppercase">Registro Directo a Base de Datos</p>
                    </div>
                </div>
                <button type="button" onclick="closeServicioModal()" class="text-slate-400 hover:text-red-500 transition-colors">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>

            <form id="formNuevoServicioAjax" class="p-6" novalidate>
                {% csrf_token %}

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div class="sm:col-span-2">
                        <label class="block text-[9px] font-bold text-slate-500 uppercase mb-1">Código de Facturación <span class="text-red-500">*</span></label>
                        <input type="text" name="codigo_facturacion" required
                            data-validar data-label="Código de facturación" data-min="2" maxlength="50"
                            class="js-input w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-xs font-mono-tech focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 outline-none transition-all"
                            placeholder="EJ: M-001">
                        <div class="campo-estado" data-for="codigo_facturacion">
                            <span class="campo-msg" data-msg></span>
                            <span class="campo-contador" data-contador></span>
                        </div>
                    </div>

                    <div class="sm:col-span-2">
                        <label class="block text-[9px] font-bold text-slate-500 uppercase mb-1">Nombre del Ensayo <span class="text-red-500">*</span></label>
                        <input type="text" name="nombre" required
                            data-validar data-label="Nombre" data-min="2" maxlength="200"
                            class="js-input w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-xs font-bold focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 outline-none transition-all"
                            placeholder="EJ: ANÁLISIS GRANULOMÉTRICO POR TAMIZADO">
                        <div class="campo-estado" data-for="nombre">
                            <span class="campo-msg" data-msg></span>
                            <span class="campo-contador" data-contador></span>
                        </div>
                    </div>

                    <div>
                        <label class="block text-[9px] font-bold text-slate-500 uppercase mb-1">Norma de Ensayo</label>
                        <select name="norma"
                            class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-xs font-semibold text-slate-700 focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 outline-none transition-all">
                            <option value="">-- SIN NORMA --</option>
                            {% for n in normas %}
                            <option value="{{ n.pk }}">{{ n.codigo }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div>
                        <label class="block text-[9px] font-bold text-slate-500 uppercase mb-1">Método</label>
                        <select name="metodo"
                            class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-xs font-semibold text-slate-700 focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 outline-none transition-all">
                            <option value="">-- SIN MÉTODO --</option>
                            {% for m in metodos %}
                            <option value="{{ m.pk }}">{{ m.codigo }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div>
                        <label class="block text-[9px] font-bold text-slate-500 uppercase mb-1">Unidad de Medida</label>
                        <input type="text" name="unidad_base" value="ENSAYO"
                            data-validar data-label="Unidad" maxlength="50"
                            class="js-input w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-xs font-bold uppercase focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 outline-none transition-all">
                        <div class="campo-estado" data-for="unidad_base">
                            <span class="campo-msg" data-msg></span>
                            <span class="campo-contador" data-contador></span>
                        </div>
                    </div>

                    <div>
                        <label class="block text-[9px] font-bold text-slate-500 uppercase mb-1">Precio Base (S/)</label>
                        <input type="number" step="0.01" min="0" name="precio_base" value="0.00"
                            class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-xs font-extrabold text-blue-700 focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 outline-none transition-all">
                    </div>
                </div>

                <div class="mt-6 pt-4 border-t border-slate-100 flex items-center justify-between">
                    <div class="flex items-center gap-2 text-slate-400">
                        <i data-lucide="shield-check" class="w-4 h-4 text-emerald-500"></i>
                        <span class="text-[8px] font-mono-tech uppercase tracking-widest">Se agrega al catálogo real</span>
                    </div>

                    <div class="flex gap-3">
                        <button type="button" onclick="closeServicioModal()"
                            class="px-5 py-2 text-[10px] font-black text-slate-400 uppercase hover:text-slate-600 transition-colors">
                            Cancelar
                        </button>
                        <button type="submit"
                            class="bg-slate-900 text-white px-8 py-2.5 rounded-xl text-[10px] font-black uppercase tracking-widest shadow-xl shadow-slate-200 hover:bg-blue-600 hover:-translate-y-0.5 transition-all flex items-center gap-2">
                            <i data-lucide="check-circle" class="w-3.5 h-3.5"></i>
                            Registrar y Seleccionar
                        </button>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
