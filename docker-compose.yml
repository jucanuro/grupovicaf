services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  lab:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    restart: unless-stopped
    command: gunicorn grupovicaf.wsgi:application --bind 0.0.0.0:8000 --workers 3
    environment:
      SITE_ROLE: lab
    env_file:
      - .env
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/mediafiles
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    restart: unless-stopped
    command: gunicorn grupovicaf.wsgi:application --bind 0.0.0.0:8001 --workers 3
    environment:
      SITE_ROLE: web
    env_file:
      - .env
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/mediafiles
    ports:
      - "8001:8001"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    restart: unless-stopped
    command: celery -A grupovicaf worker -l info --concurrency=2
    environment:
      SITE_ROLE: lab
    env_file:
      - .env
    volumes:
      - media_volume:/app/mediafiles
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  # Planificador de tareas periódicas (hoy: barrido diario de proyectos
  # vencidos, ver grupovicaf/celery.py).
  beat:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    restart: unless-stopped
    command: celery -A grupovicaf beat -l info --schedule /tmp/celerybeat-schedule
    environment:
      SITE_ROLE: lab
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  # nginx se añade en fases posteriores.

volumes:
  postgres_data:
  static_volume:
  media_volume:
