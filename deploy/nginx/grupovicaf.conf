# Grupo VICAF — nginx para los 3 dominios sobre dos sockets gunicorn.
#
#   grupovicaf.com          -> 301 -> https://www.grupovicaf.com (canónico)
#   www.grupovicaf.com      -> socket vicafweb  (rol 'web')
#   laboratorio.grupovicaf.com -> socket vicaflab (rol 'lab')
#
# IMPORTANTE: en esta instancia YA existe una config sirviendo
# laboratorio.grupovicaf.com (probablemente en /etc/nginx/sites-available/).
# No la borres a ciegas — diff contra el bloque `laboratorio.grupovicaf.com`
# de más abajo (upstream, client_max_body_size, cabeceras que ya tuviera) y
# fusiona antes de reemplazar. Ver deploy/INSTRUCTIVO.md paso de nginx.
#
# Instalar como /etc/nginx/sites-available/grupovicaf.conf y enlazar en
# sites-enabled/. Los certificados de certbot se insertan solos (certbot
# --nginx reescribe los bloques 443 la primera vez que se corre).

# --- Sockets de gunicorn (ver deploy/systemd/) ---
upstream vicaflab {
    server unix:/run/gunicorn/vicaflab.sock fail_timeout=0;
}

upstream vicafweb {
    server unix:/run/gunicorn/vicafweb.sock fail_timeout=0;
}

# --- Config común a todos los server{} con contenido (no al redirect) ---
map $sent_http_content_type $expires_static {
    default                    off;
    text/css                   30d;
    application/javascript     30d;
    ~image/                    30d;
    font/woff2                 30d;
}

gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_types text/plain text/css application/json application/javascript
    text/xml application/xml application/xml+rss text/javascript
    image/svg+xml font/woff2;

# --- HTTP (80): solo redirect a HTTPS, salvo el reto ACME de certbot ---
server {
    listen 80;
    listen [::]:80;
    server_name grupovicaf.com www.grupovicaf.com laboratorio.grupovicaf.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- grupovicaf.com (desnudo): 301 al canónico www ---
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name grupovicaf.com;

    # certbot --nginx añade aquí ssl_certificate/ssl_certificate_key
    # (certificado compartido con www.grupovicaf.com, -d grupovicaf.com -d www.grupovicaf.com).

    return 301 https://www.grupovicaf.com$request_uri;
}

# --- www.grupovicaf.com: web institucional pública (rol 'web') ---
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.grupovicaf.com;

    # certbot --nginx añade aquí ssl_certificate/ssl_certificate_key

    client_max_body_size 20M;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;

    access_log /var/log/nginx/vicafweb.access.log;
    error_log  /var/log/nginx/vicafweb.error.log;

    location /static/ {
        alias /var/www/projects/grupovicaf/staticfiles/;
        expires $expires_static;
        access_log off;
    }

    location /media/ {
        alias /var/www/projects/grupovicaf/mediafiles/;
        expires 30d;
        access_log off;
    }

    location / {
        proxy_pass http://vicafweb;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_redirect off;
    }
}

# --- laboratorio.grupovicaf.com: LIMS interno (rol 'lab') ---
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name laboratorio.grupovicaf.com;

    # certbot --nginx añade aquí ssl_certificate/ssl_certificate_key
    # (respeta el certificado ya emitido si esta config reemplaza una
    # existente — no re-emitir de cero salvo que certbot lo pida).

    client_max_body_size 20M;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;

    access_log /var/log/nginx/vicaflab.access.log;
    error_log  /var/log/nginx/vicaflab.error.log;

    location /static/ {
        alias /var/www/projects/grupovicaf/staticfiles/;
        expires $expires_static;
        access_log off;
    }

    location /media/ {
        alias /var/www/projects/grupovicaf/mediafiles/;
        expires 30d;
        access_log off;
    }

    location / {
        proxy_pass http://vicaflab;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_redirect off;
        # Informes PDF pueden tardar; generación real ya va por Celery, pero
        # deja margen para descargas grandes.
        proxy_read_timeout 120s;
    }
}
