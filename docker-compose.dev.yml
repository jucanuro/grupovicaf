services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-grupovicaf}
      POSTGRES_USER: ${DB_USER:-grupovicaf}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-grupovicaf}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-grupovicaf} -d ${DB_NAME:-grupovicaf}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  # Servidor de correo de pruebas: recibe todo lo que envía la plataforma de
  # correo (nada sale a Internet). Bandeja web en http://localhost:8025;
  # SMTP en localhost:1025 para mandar correos de prueba desde otro programa.
  mailpit:
    image: axllent/mailpit:v1.20.0
    ports:
      - "${MAILPIT_WEB_PORT:-8025}:8025"
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
    environment:
      MP_MAX_MESSAGES: 5000

  lab:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    command: python manage.py runserver 0.0.0.0:8000
    user: root
    environment:
      SITE_ROLE: lab
      DJANGO_SETTINGS_MODULE: grupovicaf.settings.dev
      # Correo real en local: lo que se envía va a Mailpit y lo que llega a las
      # cuentas VICAF vuelve a las bandejas (ver correo/mailpit.py).
      CORREO_ENVIO: ${CORREO_ENVIO:-smtp}
      CORREO_SMTP_HOST: ${CORREO_SMTP_HOST:-mailpit}
      CORREO_SMTP_PUERTO: ${CORREO_SMTP_PUERTO:-1025}
      CORREO_SMTP_TLS: ${CORREO_SMTP_TLS:-False}
      CORREO_MAILPIT_URL: ${CORREO_MAILPIT_URL:-http://mailpit:8025}
    env_file:
      - .env
    volumes:
      - .:/app
    ports:
      - "${LAB_HOST_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    command: python manage.py runserver 0.0.0.0:8001
    user: root
    environment:
      SITE_ROLE: web
      DJANGO_SETTINGS_MODULE: grupovicaf.settings.dev
    env_file:
      - .env
    volumes:
      - .:/app
    ports:
      - "8001:8001"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    command: celery -A grupovicaf worker -l info -Q celery,correo
    user: root
    environment:
      SITE_ROLE: lab
      DJANGO_SETTINGS_MODULE: grupovicaf.settings.dev
      # Correo real en local: lo que se envía va a Mailpit y lo que llega a las
      # cuentas VICAF vuelve a las bandejas (ver correo/mailpit.py).
      CORREO_ENVIO: ${CORREO_ENVIO:-smtp}
      CORREO_SMTP_HOST: ${CORREO_SMTP_HOST:-mailpit}
      CORREO_SMTP_PUERTO: ${CORREO_SMTP_PUERTO:-1025}
      CORREO_SMTP_TLS: ${CORREO_SMTP_TLS:-False}
      CORREO_MAILPIT_URL: ${CORREO_MAILPIT_URL:-http://mailpit:8025}
    env_file:
      - .env
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  # Planificador de tareas periódicas (hoy: barrido diario de proyectos
  # vencidos, ver grupovicaf/celery.py). El archivo de estado va a /tmp para
  # no ensuciar el árbol montado en /app.
  beat:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    command: celery -A grupovicaf beat -l info --schedule /tmp/celerybeat-schedule
    user: root
    environment:
      SITE_ROLE: lab
      DJANGO_SETTINGS_MODULE: grupovicaf.settings.dev
      # Correo real en local: lo que se envía va a Mailpit y lo que llega a las
      # cuentas VICAF vuelve a las bandejas (ver correo/mailpit.py).
      CORREO_ENVIO: ${CORREO_ENVIO:-smtp}
      CORREO_SMTP_HOST: ${CORREO_SMTP_HOST:-mailpit}
      CORREO_SMTP_PUERTO: ${CORREO_SMTP_PUERTO:-1025}
      CORREO_SMTP_TLS: ${CORREO_SMTP_TLS:-False}
      CORREO_MAILPIT_URL: ${CORREO_MAILPIT_URL:-http://mailpit:8025}
    env_file:
      - .env
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  # Compilación de Tailwind en modo watch. El pipeline real (package.json,
  # tailwind.config.js) se añade en F3; por ahora el contenedor solo se
  # mantiene arriba para no romper `docker compose up`.
  node:
    image: node:20-alpine
    working_dir: /app
    # tailwindcss --watch se apaga solo en cuanto detecta stdin cerrado (lo que
    # `docker compose up -d` hace por defecto). Sin stdin_open/tty el contenedor
    # corre `npm install`, arranca el watcher y muere a los ~3s en cada `up`.
    stdin_open: true
    tty: true
    volumes:
      - .:/app
    command: >
      sh -c "if [ -f package.json ]; then npm install && npm run watch:css; else
      echo 'Tailwind se configura en F3 (falta package.json)' && tail -f /dev/null; fi"

volumes:
  postgres_data:
