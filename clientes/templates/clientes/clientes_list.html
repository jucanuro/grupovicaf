{% extends "base_vicafpro.html" %}
{% load static %}
{% block content %}

<style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@400;500&display=swap');
    
    body { 
        font-family: 'Inter', sans-serif; 
        background-color: #f8fafc;
    }

    .bg-vicaf-engine {
        position: fixed; inset: 0; z-index: -1; background-color: #f8fafc;
        background-image: linear-gradient(rgba(226, 232, 240, 0.5) 1px, transparent 1px), linear-gradient(90deg, rgba(226, 232, 240, 0.5) 1px, transparent 1px);
        background-size: 40px 40px;
    }

    .tooltip-pinned {
        pointer-events: auto !important;
    }

    .loading-fade {
        opacity: 0.5;
        transition: opacity 0.2s ease;
    }
</style>

<div class="bg-vicaf-engine"></div>

<div class="max-w-full mx-auto p-3 sm:p-4 relative z-10 space-y-4 flex flex-col">
    <div class="command-header" data-command-header>
    <div class="command-header__backdrop" data-command-backdrop></div>

    <!-- Barra mínima -->
    <div class="command-header__toolbar">
        <button type="button"
                class="command-header__trigger"
                data-command-toggle
                aria-label="Abrir panel de acciones">
            <i data-lucide="panel-top-open" class="w-4 h-4"></i>
            <span class="command-header__trigger-label">Panel</span>
        </button>

        <a href="{% url 'clientes:crear_cliente' %}"
           class="command-header__action">
            <i data-lucide="plus" class="w-3.5 h-3.5"></i>
            Nuevo Cliente
        </a>
    </div>

    <!-- Overlay -->
    <div class="command-header__panel" data-command-panel>
        <div class="command-header__card relative p-4 sm:p-5">
            <div class="command-header__glow"></div>

            <div class="relative flex items-start justify-between gap-4">
                <div class="flex items-center gap-4 min-w-0">
                    <div class="w-11 h-11 bg-blue-600 rounded-xl flex items-center justify-center text-white shadow-md flex-shrink-0">
                        <i data-lucide="shield-check" class="w-5 h-5"></i>
                    </div>

                    <div class="command-header__title-wrap">
                        <h1 class="command-header__title truncate">
                            Nuestros Clientes
                        </h1>
                        <p class="command-header__subtitle truncate">
                            VicafPro Sistema de administración
                        </p>
                    </div>
                </div>

                <button type="button"
                        class="command-header__close"
                        data-command-close
                        aria-label="Cerrar panel">
                    <i data-lucide="x" class="w-4 h-4"></i>
                </button>
            </div>

            <div class="relative mt-4">
                <form method="GET"
                      action="{% url 'clientes:lista_clientes' %}"
                      id="search-form"
                      class="command-header__search max-w-xl">
                    <i data-lucide="search" class="w-3.5 h-3.5 text-slate-400 mr-2"></i>
                    <input type="text"
                           name="q"
                           id="search-input"
                           data-lista-buscador
                           value="{{ query|default:'' }}"
                           class="bg-transparent border-none outline-none text-xs font-semibold text-slate-700 w-full"
                           placeholder="Buscar por nombre, RUC o código..."
                           autocomplete="off">
                </form>
            </div>
        </div>
    </div>
</div>

    <div class="bg-white border border-slate-200 rounded-xl shadow-sm overflow-hidden"
         data-lista-contenedor data-lista-url="{% url 'clientes:lista_clientes' %}">
        {% include 'clientes/includes/clientes_tabla.html' %}
    </div>
</div>

{% endblock %}

{% block extra_scripts %}
<script>
    // El "modal" de detalle: un .company-tooltip que se muestra al pasar el
    // cursor sobre el nombre y se puede FIJAR (con el ojo de Acciones o clic
    // en el nombre). El estado "fijado" vive en la clase .tooltip-pinned.
    function mostrarTooltip(t) {
        t.classList.remove('invisible', 'opacity-0', 'scale-95', 'pointer-events-none');
        t.classList.add('visible', 'opacity-100', 'scale-100');
    }

    function ocultarTooltip(t) {
        t.classList.remove('visible', 'opacity-100', 'scale-100', 'tooltip-pinned');
        t.classList.add('invisible', 'opacity-0', 'scale-95', 'pointer-events-none');
        const btn = t.querySelector('.close-tooltip-btn');
        if (btn) btn.classList.add('hidden');
    }

    function fijarTooltip(tooltip) {
        document.querySelectorAll('.company-tooltip').forEach(ocultarTooltip);
        mostrarTooltip(tooltip);
        tooltip.classList.add('tooltip-pinned');
        const btn = tooltip.querySelector('.close-tooltip-btn');
        if (btn) btn.classList.remove('hidden');
    }

    function initTooltips() {
        // Los tooltips se mueven a <body>; al re-renderizar la tabla (búsqueda)
        // los del render anterior quedan huérfanos ahí. Limpiarlos primero.
        document.querySelectorAll('body > .company-tooltip').forEach(t => t.remove());

        document.querySelectorAll('.info-trigger-zone').forEach(zone => {
            const tooltip = zone.querySelector('.company-tooltip');
            if (!tooltip) return;

            const closeBtn = tooltip.querySelector('.close-tooltip-btn');
            const row = zone.closest('.group');
            const eyeBtn = row ? row.querySelector('[data-ver-cliente]') : null;
            const estaFijado = () => tooltip.classList.contains('tooltip-pinned');

            if (tooltip.parentElement !== document.body) {
                document.body.appendChild(tooltip);
            }

            if (eyeBtn) {
                eyeBtn.addEventListener('click', (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    fijarTooltip(tooltip);
                });
            }

            zone.addEventListener('mouseenter', () => {
                if (window.innerWidth < 768 || estaFijado()) return;
                mostrarTooltip(tooltip);
            });

            zone.addEventListener('mouseleave', () => {
                if (window.innerWidth < 768 || estaFijado()) return;
                ocultarTooltip(tooltip);
            });

            zone.addEventListener('click', (e) => {
                e.stopPropagation();
                fijarTooltip(tooltip);
            });

            if (closeBtn) {
                closeBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    ocultarTooltip(tooltip);
                });
            }

            tooltip.addEventListener('click', (e) => e.stopPropagation());
        });
    }

    document.addEventListener('DOMContentLoaded', () => {
        if (typeof lucide !== 'undefined') lucide.createIcons();
        initTooltips();

        // El filtrado en vivo (encabezado + input del panel) lo maneja
        // static/js/lista_buscador.js. Cuando refresca la tabla emite
        // `lista:actualizada`; acá solo re-cableamos los tooltips/ojo.
        const contenedor = document.querySelector('[data-lista-contenedor]');
        if (contenedor) {
            contenedor.addEventListener('lista:actualizada', initTooltips);
        }

        // Clic en cualquier otro lado: cierra el detalle fijado.
        document.addEventListener('click', () => {
            document.querySelectorAll('.company-tooltip').forEach(ocultarTooltip);
        });
    });
</script>
{% endblock %}
