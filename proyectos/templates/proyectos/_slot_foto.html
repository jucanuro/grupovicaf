{# Un recuadro de foto con recorte; variables: s (slot), ancho (ocupa 2 columnas), solo_lectura. #}
<div class="{% if ancho %}col-span-2{% endif %}" data-slot="{{ s.tipo }}" data-proporcion="{{ s.ancho }}/{{ s.alto }}">
    <p class="text-xs font-semibold text-slate-700 mb-1 leading-tight">{{ s.numero }}. {{ s.etiqueta }}</p>
    <div class="foto-marco" style="aspect-ratio: {{ s.ancho }} / {{ s.alto }};"
         data-marco data-estado="{% if s.foto %}ok{% else %}vacio{% endif %}">
        {% if s.foto %}
            <img src="{% url 'proyectos:foto_compresion' s.foto.pk %}?v={{ s.foto.subido_en|date:'U' }}" alt="{{ s.etiqueta }}" width="{{ s.foto.ancho }}" height="{{ s.foto.alto }}" loading="lazy">
        {% else %}
            <span class="text-slate-400 flex flex-col items-center gap-1 text-[11px]" data-vacio>
                <i data-lucide="image-plus" class="w-6 h-6"></i> Sin foto
            </span>
        {% endif %}
        <div class="foto-cargando">Subiendo…</div>
    </div>
    <p class="text-[11px] text-red-600 mt-1 hidden" data-error></p>
    {% if not solo_lectura %}
    <button type="button" class="hidden mt-1.5 v-btn v-btn--peligro v-btn--sm v-btn--block" data-reintentar>Reintentar envío</button>
    <div class="mt-1 flex gap-3">
        <button type="button" class="text-[11px] font-bold text-blue-700 underline {% if not s.foto %}hidden{% endif %}" data-repetir>Repetir esta foto</button>
        <button type="button" class="text-[11px] font-bold text-slate-500 underline hidden" data-ajustar>Ajustar encuadre</button>
    </div>
    {% endif %}
</div>
