<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>{% if informe %}{{ informe.codigo_informe }}{% else %}Vista previa · {{ datos.solicitud.codigo_solicitud }}{% endif %}</title>
<style>
@page { size: A4; margin: 9mm 9mm 17mm 9mm;
        @bottom-center { content: "{{ datos.negocio.localidad }} - {{ datos.negocio.localidad }} - Perú | {{ datos.negocio.direccion }} | {{ datos.negocio.telefono }} | {{ datos.negocio.correo }}"; font-size: 6pt; color: #333; }
        @bottom-right { content: "Página " counter(page) " de " counter(pages); font-size: 6.5pt; color: #333; } }
* { box-sizing: border-box; }
body { margin: 0; {% if modo == 'web' %}background: #e2e8f0; padding: 24px 0;{% endif %} }
{% if modo == 'web' %}.pagina { background: #fff; width: 210mm; min-height: 297mm; margin: 0 auto; padding: 9mm; box-shadow: 0 10px 30px rgba(15,23,42,.18); }
.aviso-previa { width: 210mm; margin: 0 auto 12px; font: 600 13px system-ui, sans-serif; color: #92400e; background: #fffbeb; border: 1px solid #fde68a; border-radius: 10px; padding: 8px 12px; }
@media (max-width: 820px) { .pagina, .aviso-previa { width: auto; margin: 0 8px; padding: 18px 14px; } }{% endif %}
.cab { display: flex; align-items: center; justify-content: space-between; border-bottom: 1.5pt solid #0b3a6e; padding-bottom: 4pt; margin-bottom: 6pt; }
.cab img { height: 30pt; }
.fin { text-align: center; font: 700 8pt "DejaVu Sans", Arial, sans-serif; letter-spacing: 1pt; margin-top: 6pt; break-before: avoid; page-break-before: avoid; }
.cab .acred { text-align: right; font: 700 7.5pt "DejaVu Sans", Arial, sans-serif; color: #0b3a6e; max-width: 70%; }
{% include "proyectos/informe_hoja.css" %}
</style>
</head>
<body>
{% if modo == 'web' %}<div class="aviso-previa">Vista previa del borrador. El código, la firma y el QR se ponen al emitir.</div>{% endif %}
<div class="pagina">
  <div class="hoja">{{ cuerpo|safe }}</div>
  <p class="fin">&gt; &gt; &gt; &gt; &gt; Fin del Informe &lt; &lt; &lt; &lt; &lt;</p>
</div>
</body>
</html>
