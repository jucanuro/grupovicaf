<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<base target="_blank">
<style>
    html, body { margin: 0; padding: 0; }
    body { padding: 4px 2px 12px; font-family: 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
           font-size: 15px; line-height: 1.55; color: #0F172A; overflow-wrap: anywhere; }
    img { max-width: 100%; height: auto; }
    img[data-src-bloqueada] { display: inline-block; min-width: 24px; min-height: 16px; background: #F4F6F9;
           border: 1px dashed #E5E8EE; }
    table { max-width: 100%; }
    blockquote { margin: 0 0 0 8px; padding-left: 12px; border-left: 3px solid #E5E8EE; color: #475569; }
    a { color: #1D4ED8; }
    pre { white-space: pre-wrap; }
</style>
</head>
<body>{{ html|safe }}</body>
</html>
